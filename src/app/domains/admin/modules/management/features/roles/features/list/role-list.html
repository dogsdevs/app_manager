<div class="@container mx-auto flex w-full flex-auto flex-col overflow-hidden">
  <mat-sidenav-container
    class="h-full flex-auto [&_.mat-drawer-backdrop]:fixed"
    (backdropClick)="closeDrawer()"
  >
    <!-- Drawer -->
    <mat-sidenav
      class="w-full bg-white sm:w-lg dark:bg-neutral-900"
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="isDrawerOpen()"
      [position]="'end'"
      [fixedInViewport]="isMobile()"
      disableClose
    >
      <router-outlet></router-outlet>
    </mat-sidenav>

    <mat-sidenav-content
      class="flex flex-auto flex-col"
      [class.border-r]="isDrawerOpen()"
    >
      <!-- Header -->
      <div class="flex items-center gap-x-4 px-6 py-4 lg:px-10 lg:py-8">
        <div class="flex flex-col gap-y-0.5">
          <div class="text-xl font-semibold tracking-tighter sm:text-2xl">
            Roles
          </div>
          <div class="text-neutral-500">Puedes administrar los roles aquí</div>
        </div>

        <!-- Spacer -->
        <div class="flex-auto"></div>

        <!-- Actions -->
        <button matButton="filled"
        [disabled]="isDrawerOpen()"
        (click)="openCreateDrawer()">
          <mat-icon svgIcon="plus" />
          Nuevo
        </button>
      </div>

      <!-- Toolbar -->
      <div class="mb-4 flex w-full flex-col items-center gap-4 px-6 sm:flex-row lg:px-10">
        <!-- Left side: Search and Toggle -->
        <div class="flex w-full flex-col items-center gap-4 sm:flex-row sm:flex-auto">
          <mat-form-field class="w-full sm:min-w-96 sm:max-w-2xl">
            <mat-icon
              matPrefix
              svgIcon="search"
            />
            <input
              placeholder="Buscar roles por nombre..."
              matInput
              (keyup)="applyFilter($event)"
              #input
            />
          </mat-form-field>
          <mat-slide-toggle
            class="[&_.mdc-label]:ml-2"
            [checked]="showDisabledRows()"
            (change)="toggleEnabledFilter(!$event.checked)"
            hideIcon
          >
            Mostrar deshabilitados
          </mat-slide-toggle>
        </div>

        <!-- Right side: Pagination -->
        <mat-paginator 
          [pageSizeOptions]="[10,50,100]"
          showFirstLastButtons
          class="w-155 shrink-0 bg-white dark:bg-neutral-900 [&_.mat-mdc-paginator-range-label]:inline-block [&_.mat-mdc-paginator-range-label]:w-20 [&_.mat-mdc-paginator-range-label]:text-center">
        </mat-paginator>
      </div>


      <!-- Table -->
      <div class="overflow-auto px-6 lg:px-10">
        @if (loadingList()) {
          <!-- Loading State -->
          <app-table-skeleton [rows]="5" />
        } @else if (dataSource.filteredData.length === 0) {
          <!-- Empty State -->
          <app-empty-state
            icon="clipboard-list"
            title="No hay roles"
            description="Comienza creando un nuevo rol"
            actionText="Crear rol"
            actionIcon="plus"
            [searchTerm]="searchTerm()"
            [showAction]="roles().length === 0"
            (action)="openCreateDrawer()"
            (clearSearch)="clearSearch()"
          />
        } @else {
          <!-- Table with data -->
          <table mat-table [dataSource]="dataSource" matSort class="w-full">
            
            <!-- Indicator Column -->
            <ng-container matColumnDef="indicator">
              <th mat-header-cell *matHeaderCellDef class="w-2"></th>
              <td mat-cell *matCellDef="let role" class="px-0!">
                <div class="flex items-center justify-center h-full">
                  <div 
                    class="h-8 w-1 rounded-full"
                    [class.bg-primary-600/40]="role.enabled"
                    [class.bg-neutral-400/40]="!role.enabled">
                  </div>
                </div>
              </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
              <td mat-cell *matCellDef="let role">
                <div class="flex items-center gap-2">
                  <span [innerHTML]="role.name | highlight : searchTerm()"></span>
                  @if (!role.enabled) {
                    <span class="rounded-full bg-neutral-200 px-2 py-0.5 text-xs font-medium text-neutral-700 dark:bg-neutral-700 dark:text-neutral-300">
                      Deshabilitado
                    </span>
                  }
                </div>
              </td>
            </ng-container>

          <!-- Enabled Column -->
          <ng-container matColumnDef="enabled">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="w-32">Habilitado</th>
            <td mat-cell *matCellDef="let role">
              <button
                matIconButton
                class="leading-none"
                [disabled]="loadingToggle() === role.id"
                (click)="$event.stopPropagation(); toggleEnabled(role.id, role.enabled)"
              >
                @if (loadingToggle() === role.id) {
                  <mat-icon class="animate-spin" svgIcon="loader-circle" />
                } @else {
                  @if (role.enabled) {
                    <mat-icon
                      class="text-green-600"
                      svgIcon="circle-check"
                    />
                  }
                  @if (!role.enabled) {
                    <mat-icon
                      class="text-neutral-500"
                      svgIcon="circle"
                    />
                  }
                }
              </button>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="w-32">Acciones</th>
            <td mat-cell *matCellDef="let role">
              <button 
                mat-icon-button 
                [matMenuTriggerFor]="menu"
                (click)="$event.stopPropagation()">
                <mat-icon svgIcon="ellipsis" />
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="openEditDrawer(role.id)">
                  <mat-icon svgIcon="pencil" />
                  <span>Editar</span>
                </button>
                <button mat-menu-item (click)="deleteRole(role.id)" class="text-red-600 [&_mat-icon]:text-red-600">
                  <mat-icon svgIcon="trash-2" />
                  <span>Eliminar</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" class="border-t [&>th]:text-neutral-500 [&>th]:font-medium"></tr>
          <tr 
            mat-row 
            *matRowDef="let row; columns: displayedColumns"
            class="cursor-pointer hover:bg-neutral-50 dark:hover:bg-neutral-800"
            [class.opacity-50]="!row.enabled"
            (click)="openEditDrawer(row.id)">
          </tr>
        </table>
        }
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
